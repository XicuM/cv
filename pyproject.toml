[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cv-cli"
version = "0.2.0"
description = "CLI tool for building multi-language CVs, cover letters, and personal info cards from YAML."
readme = "README.md"
requires-python = ">=3.7"
dependencies = [
    "click>=8.0.0",
    "pyyaml>=6.0"
]

[project.scripts]
cv = "cv_cli.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"cv_cli" = ["templates/*.tex", "i18n/*.yaml", "resources/templates/*.yaml"]
